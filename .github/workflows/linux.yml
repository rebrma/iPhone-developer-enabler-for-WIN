name: Linux build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.7'
          architecture: x64
      - name: Install Linux build and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libtcl8.6 libtk8.6 xvfb xauth xdotool scrot
      - name: Test and build native executable
        run: PYTHON=python bash build-linux.sh
      - name: Test frozen GUI and CLI
        run: xvfb-run -a -s '-screen 0 1024x768x24' .venv-build/bin/python packaging/smoke_linux.py dist/onefile/iOS-Developer-Mode-Helper --screenshot build/linux-gui.png
      - name: Test standalone runtime in clean Ubuntu without Python
        run: |
          docker run --rm --volume "$PWD/dist/onefile:/app:ro" ubuntu:22.04 /app/iOS-Developer-Mode-Helper --self-test
      - name: Package release files
        run: .venv-build/bin/python packaging/make_release.py --exe dist/onefile/iOS-Developer-Mode-Helper --out dist/release --platform linux-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iOS-Developer-Mode-Helper-linux-x86_64
          path: dist/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-smoke-evidence
          path: |
            build/linux-gui.png
            build/linux-gui.log
            build/onefile/frozen-self-test.json
          if-no-files-found: ignore
