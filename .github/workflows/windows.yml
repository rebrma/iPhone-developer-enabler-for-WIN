name: Windows build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.7'
          architecture: x64
      - name: Test and build standalone executable
        shell: pwsh
        run: ./build.ps1
      - name: Package release files
        shell: pwsh
        run: .venv-build/Scripts/python.exe packaging/make_release.py --exe dist/onefile/iOS-Developer-Mode-Helper.exe --out dist/release --platform windows-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iOS-Developer-Mode-Helper-windows-x64
          path: dist/release/
          if-no-files-found: error
